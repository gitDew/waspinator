<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Waspinator project website">
  <title>Waspinator</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #f6f7f2;
      color: #20251d;
    }

    main {
      width: min(36rem, calc(100% - 3rem));
      padding: 3rem 0;
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.5rem, 10vw, 5rem);
      letter-spacing: -0.06em;
    }

    p {
      margin: 0 0 1.5rem;
      font-size: 1.125rem;
    }

    a {
      color: inherit;
      font-weight: 600;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #20251d;
        color: #f6f7f2;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Waspinator</h1>
    <p>The project website is coming soon.</p>
    <a href="https://github.com/gitDew/waspinator">View the project on GitHub</a>
  </main>
</body>
</html>
